openapi: 3.0.3
info:
  title: AI Assistant API
  version: 0.1.0
  description: "Phase 2 API specification (baseline only)."
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  phase:
                    type: string
                    example: "phase-2"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found
                message: Endpoint not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal_error
                message: Internal server error
  /api/info:
    get:
      responses:
        '200':
          description: Basic API info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "AI Assistant"
                  phase:
                    type: string
                    example: "phase-2"
                  status:
                    type: string
                    example: "backend baseline active"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found
                message: Endpoint not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal_error
                message: Internal server error
  /api/version:
    get:
      summary: Get API version
      description: Return static API version and current phase.
      responses:
        '200':
          description: API version info
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                  - phase
                properties:
                  version:
                    type: string
                    example: "0.1.0"
                  phase:
                    type: string
                    example: "phase-2"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found
                message: Endpoint not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal_error
                message: Internal server error
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: "internal_error"
        message:
          type: string
          example: "Internal server error"
      required:
        - error
        - message
