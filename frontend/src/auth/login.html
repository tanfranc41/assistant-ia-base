<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
  </head>
  <body>
    <main>
      <h1>Login</h1>
      <form id="login-form">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          required
        />
        <button type="submit">Submit</button>
      </form>
      <p id="status" aria-live="polite" role="status"></p>
    </main>
    <script type="module" src="./login.js"></script>
  </body>
</html>
