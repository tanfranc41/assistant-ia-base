<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#cf222e">
  <title>AI Assistant</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f8fa;
      color: #24292f;
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 1px 2px rgba(27, 31, 35, 0.1);
      max-width: 360px;
      width: 90%;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 20px;
    }
    .field {
      margin: 8px 0;
    }
    .label {
      font-weight: bold;
      margin-right: 6px;
    }
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      color: #24292f;
      margin-top: 6px;
    }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      background: #cf222e;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled {
      background: #d8dee4;
      color: #57606a;
      cursor: not-allowed;
    }
    .notice {
      margin-top: 12px;
      color: #0969da;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">AI Assistant</h1>
    <div class="field">
      <span id="language-label" class="label">Language:</span>
      <select id="language-select">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="nl">Nederlands</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
    <div class="field">
      <span id="username-label" class="label">Username:</span>
      <span id="username"></span>
    </div>
    <div class="field">
      <span id="status-label" class="label">Status:</span>
      <span id="status"></span>
    </div>
    <button id="logout-button">Logout</button>
    <div id="notice" class="notice" hidden>You have been logged out.</div>
  </main>

  <script>
    const translations = {
      en: {
        langName: "English",
        title: "AI Assistant",
        labels: { language: "Language", username: "Username", status: "Status" },
        actions: { logout: "Logout" },
        notice: "You have been logged out.",
        statuses: { loggedOut: "Logged out", authenticated: "Authenticated" },
        users: { guest: "Guest", demo: "Demo User" },
      },
      fr: {
        langName: "Français",
        title: "Assistant IA",
        labels: { language: "Langue", username: "Nom d'utilisateur", status: "Statut" },
        actions: { logout: "Se déconnecter" },
        notice: "Vous avez été déconnecté.",
        statuses: { loggedOut: "Déconnecté", authenticated: "Authentifié" },
        users: { guest: "Invité", demo: "Utilisateur démo" },
      },
      nl: {
        langName: "Nederlands",
        title: "AI-assistent",
        labels: { language: "Taal", username: "Gebruikersnaam", status: "Status" },
        actions: { logout: "Afmelden" },
        notice: "Je bent afgemeld.",
        statuses: { loggedOut: "Afgemeld", authenticated: "Aangemeld" },
        users: { guest: "Gast", demo: "Demo-gebruiker" },
      },
      de: {
        langName: "Deutsch",
        title: "KI-Assistent",
        labels: { language: "Sprache", username: "Benutzername", status: "Status" },
        actions: { logout: "Abmelden" },
        notice: "Sie wurden abgemeldet.",
        statuses: { loggedOut: "Abgemeldet", authenticated: "Angemeldet" },
        users: { guest: "Gast", demo: "Demo-Benutzer" },
      },
    };

    function generateDemoToken() {
      if (typeof crypto !== "undefined" && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      // Demo-only fallback when Web Crypto is unavailable; Math.random() is not secure and must never be used for production auth tokens.
      return `demo-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }
    const demoToken = generateDemoToken();
    // In-memory auth token and user snapshot
    let authToken = demoToken;
    let userState = { userKey: "demo", statusKey: "authenticated" };
    let currentLang = "en";

    const titleEl = document.getElementById("title");
    const usernameLabel = document.getElementById("username-label");
    const statusLabel = document.getElementById("status-label");
    const languageLabel = document.getElementById("language-label");
    const languageSelect = document.getElementById("language-select");
    const usernameEl = document.getElementById("username");
    const statusEl = document.getElementById("status");
    const logoutButton = document.getElementById("logout-button");
    const noticeEl = document.getElementById("notice");

    function renderLanguageOptions() {
      Array.from(languageSelect.options).forEach((option) => {
        option.textContent = translations[option.value].langName;
      });
      languageSelect.value = currentLang;
    }

    function render() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang;
      titleEl.textContent = t.title;
      languageLabel.textContent = `${t.labels.language}:`;
      usernameLabel.textContent = `${t.labels.username}:`;
      statusLabel.textContent = `${t.labels.status}:`;
      logoutButton.textContent = t.actions.logout;
      noticeEl.textContent = t.notice;
      const loggedIn = !!authToken;
      usernameEl.textContent = t.users[userState.userKey];
      statusEl.textContent = t.statuses[userState.statusKey];
      logoutButton.disabled = !loggedIn;
      noticeEl.hidden = loggedIn;
      renderLanguageOptions();
    }

    logoutButton.addEventListener("click", () => {
      // In-memory only; no persistence or backend logout per project requirements.
      authToken = null; // clear in-memory token
      userState = { userKey: "guest", statusKey: "loggedOut" }; // reset UI state
      render();
    });

    languageSelect.addEventListener("change", (event) => {
      currentLang = event.target.value;
      render();
    });

    render();

    if (
      "serviceWorker" in navigator &&
      (window.location.protocol === "https:" ||
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1" ||
        window.location.hostname === "::1")
    ) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.error("Service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
