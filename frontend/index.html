<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#cf222e">
  <title>AI Assistant</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --border: #e4e8f0;
      --text: #0f172a;
      --muted: #4b5563;
      --accent: #cf222e;
      --accent-dark: #9f1f27;
      --accent-rgb: 207, 34, 46;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
      --breakpoint-sm: 32rem;
      /* Opacity tuning for focus and elevation states */
      --accent-focus-border-opacity: 0.35;
      --accent-focus-glow-opacity: 0.15;
      --accent-shadow-strong: 0.28;
      --accent-shadow-hover: 0.34;
      --accent-shadow-pressed: 0.25;
      --accent-focus-border: rgba(var(--accent-rgb), var(--accent-focus-border-opacity));
      --accent-focus-glow: rgba(var(--accent-rgb), var(--accent-focus-glow-opacity));
      --accent-shadow-strong-value: 0 10px 25px rgba(var(--accent-rgb), var(--accent-shadow-strong));
      --accent-shadow-hover-value: 0 14px 30px rgba(var(--accent-rgb), var(--accent-shadow-hover));
      --accent-shadow-pressed-value: 0 8px 18px rgba(var(--accent-rgb), var(--accent-shadow-pressed));
      --bg-accent-blue-rgb: 37, 99, 235;
      --font-family-system: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --input-bg: #f8fafc;
      --accent-gradient-end: #e44a57;
      --notice-bg: #fef2f2;
      --notice-border: rgba(var(--accent-rgb), 0.25);
      --panel-accent: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 250, 252, 0.92) 100%);
      --field-border: rgba(148, 163, 184, 0.5);
      --card-border: rgba(148, 163, 184, 0.18);
      --heading: #0b1224;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-family-system);
      background:
        radial-gradient(circle at 20% 20%, rgba(var(--accent-rgb), 0.08), transparent 32%),
        var(--bg);
      color: var(--text);
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px 20px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--panel-accent);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 30px 26px;
      box-shadow: var(--shadow);
      width: min(100%, var(--breakpoint-sm));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--heading);
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .label {
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
      line-height: 1.2;
    }
    select {
      width: 100%;
      padding: 12px 12px;
      border: 1px solid var(--field-border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    select:hover {
      border-color: rgba(var(--accent-rgb), 0.25);
      background: #fff;
    }
    select:focus {
      outline: 2px solid transparent;
      border-color: var(--accent-focus-border);
      box-shadow: 0 0 0 4px var(--accent-focus-glow);
      background: var(--panel);
    }
    button {
      margin-top: 8px;
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-gradient-end) 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: var(--accent-shadow-strong-value);
      letter-spacing: 0.02em;
    }
    button:hover:enabled {
      filter: brightness(1.05);
      transform: translateY(-1px);
      box-shadow: var(--accent-shadow-hover-value);
    }
    button:focus-visible {
      outline: 2px solid transparent;
      box-shadow: 0 0 0 4px var(--accent-focus-glow), var(--accent-shadow-hover-value);
    }
    button:active:enabled {
      transform: translateY(0);
      box-shadow: var(--accent-shadow-pressed-value);
    }
    button:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }
    .display-field,
    #username,
    #status {
      display: inline-flex;
      align-items: center;
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      background: var(--input-bg);
      border: 1px solid var(--field-border);
      font-weight: 600;
      color: var(--text);
      min-height: 42px;
      letter-spacing: 0.01em;
    }
    #status {
      background: rgba(var(--accent-rgb), 0.08);
      border-color: rgba(var(--accent-rgb), 0.24);
      color: var(--accent-dark);
      font-weight: 700;
    }
    .notice {
      margin-top: 4px;
      padding: 12px 14px;
      background: var(--notice-bg);
      border: 1px solid var(--notice-border);
      border-radius: 10px;
      color: var(--accent-dark);
      font-size: 14px;
      box-shadow: 0 6px 18px rgba(var(--accent-rgb), 0.08);
      letter-spacing: 0.01em;
    }
    @media (max-width: var(--breakpoint-sm)) {
      body {
        padding: 20px 16px;
      }
      .card {
        padding: 22px 20px;
        gap: 12px;
      }
      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">AI Assistant</h1>
    <div class="field">
      <span id="language-label" class="label">Language:</span>
      <select id="language-select">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="nl">Nederlands</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
    <div class="field">
      <span id="username-label" class="label">Username:</span>
      <span id="username"></span>
    </div>
    <div class="field">
      <span id="status-label" class="label">Status:</span>
      <span id="status"></span>
    </div>
    <button id="logout-button">Logout</button>
    <div id="notice" class="notice" hidden>You have been logged out.</div>
  </main>

  <script>
    const translations = {
      en: {
        langName: "English",
        title: "AI Assistant",
        labels: { language: "Language", username: "Username", status: "Status" },
        actions: { logout: "Logout" },
        notice: "You have been logged out.",
        statuses: { loggedOut: "Logged out", authenticated: "Authenticated" },
        users: { guest: "Guest", demo: "Demo User" },
      },
      fr: {
        langName: "Français",
        title: "Assistant IA",
        labels: { language: "Langue", username: "Nom d'utilisateur", status: "Statut" },
        actions: { logout: "Se déconnecter" },
        notice: "Vous avez été déconnecté.",
        statuses: { loggedOut: "Déconnecté", authenticated: "Authentifié" },
        users: { guest: "Invité", demo: "Utilisateur démo" },
      },
      nl: {
        langName: "Nederlands",
        title: "AI-assistent",
        labels: { language: "Taal", username: "Gebruikersnaam", status: "Status" },
        actions: { logout: "Afmelden" },
        notice: "Je bent afgemeld.",
        statuses: { loggedOut: "Afgemeld", authenticated: "Aangemeld" },
        users: { guest: "Gast", demo: "Demo-gebruiker" },
      },
      de: {
        langName: "Deutsch",
        title: "KI-Assistent",
        labels: { language: "Sprache", username: "Benutzername", status: "Status" },
        actions: { logout: "Abmelden" },
        notice: "Sie wurden abgemeldet.",
        statuses: { loggedOut: "Abgemeldet", authenticated: "Angemeldet" },
        users: { guest: "Gast", demo: "Demo-Benutzer" },
      },
    };

    function generateDemoToken() {
      if (typeof crypto !== "undefined" && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      // Demo-only fallback when Web Crypto is unavailable; Math.random() is not secure and must never be used for production auth tokens.
      return `demo-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }
    const demoToken = generateDemoToken();
    // In-memory auth token and user snapshot
    let authToken = demoToken;
    let userState = { userKey: "demo", statusKey: "authenticated" };
    let currentLang = "en";

    const titleEl = document.getElementById("title");
    const usernameLabel = document.getElementById("username-label");
    const statusLabel = document.getElementById("status-label");
    const languageLabel = document.getElementById("language-label");
    const languageSelect = document.getElementById("language-select");
    const usernameEl = document.getElementById("username");
    const statusEl = document.getElementById("status");
    const logoutButton = document.getElementById("logout-button");
    const noticeEl = document.getElementById("notice");

    function renderLanguageOptions() {
      Array.from(languageSelect.options).forEach((option) => {
        option.textContent = translations[option.value].langName;
      });
      languageSelect.value = currentLang;
    }

    function render() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang;
      titleEl.textContent = t.title;
      languageLabel.textContent = `${t.labels.language}:`;
      usernameLabel.textContent = `${t.labels.username}:`;
      statusLabel.textContent = `${t.labels.status}:`;
      logoutButton.textContent = t.actions.logout;
      noticeEl.textContent = t.notice;
      const loggedIn = !!authToken;
      usernameEl.textContent = t.users[userState.userKey];
      statusEl.textContent = t.statuses[userState.statusKey];
      logoutButton.disabled = !loggedIn;
      noticeEl.hidden = loggedIn;
      renderLanguageOptions();
    }

    logoutButton.addEventListener("click", () => {
      // In-memory only; no persistence or backend logout per project requirements.
      authToken = null; // clear in-memory token
      userState = { userKey: "guest", statusKey: "loggedOut" }; // reset UI state
      render();
    });

    languageSelect.addEventListener("change", (event) => {
      currentLang = event.target.value;
      render();
    });

    render();

    if (
      "serviceWorker" in navigator &&
      (window.location.protocol === "https:" ||
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1" ||
        window.location.hostname === "::1")
    ) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.error("Service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
