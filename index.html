<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assistant IA Base</title>
</head>
<body>
  <main>
    <h1>Login</h1>
    <form id="login-form">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        required
      />
      <button type="submit">Submit</button>
    </form>
    <p id="user-info" aria-live="polite" role="status" aria-hidden="true"></p>
    <p id="status" aria-live="polite" role="status" aria-hidden="true"></p>
  </main>
  <script type="module" src="./frontend/src/auth/login.js"></script>
</body>
</html>
